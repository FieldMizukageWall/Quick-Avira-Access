name: "terrace"
run-name: "STERLING"
"on":
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: "Eagle-${{ github.ref_name }}"
  cancel-in-progress: true
jobs:
  CRANE:
    permissions:
      id-token: write
      contents: read
      pages: write
    runs-on: ubuntu-24.04
    environment:
      name: "github-pages"
      url: ${{ steps.Elder.outputs.page_url }}
    steps:
      - name: "Violet"
        uses: actions/checkout@v7
      - name: "silver"
        uses: actions/configure-pages@v5
      - name: "wolfsbane"
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: "metal"
        id: Elder
        uses: actions/deploy-pages@v4
